{% if access_list.oidc_providers.size > 0 %}
    # OIDC authentication via OpenResty lua-resty-openidc (requires an OpenResty runtime).
    # Attached providers are tried in order, first success wins. By design there
    # is no per-provider login chooser: an unauthenticated request is redirected
    # by the FIRST provider (redirect-and-exit), so the initial login always goes
    # through it; later providers act as fallback for flows where authenticate()
    # returns instead of redirecting. If all attached providers fail, the request
    # gets a 401.
    # OR semantics: when this list also has Basic Auth users, requests presenting an
    # "Authorization: Basic ..." header skip OIDC so that nginx auth_basic enforces them.
    # NOTE: IP allow/deny rules (clients) still apply independently of OIDC: an allowed
    # IP does NOT bypass OIDC (fail-closed AND). Only Basic Auth takes part in OR
    # semantics with OIDC.
    # NOTE: provider client secrets are embedded below. This generated file must stay
    # root-readable only (same as the /data/access htpasswd files).
    access_by_lua_block {
        local openidc = require("resty.openidc")
        -- Never trust client-supplied OIDC headers: clear unconditionally so
        -- a missing id_token claim can't leave an attacker value in place.
        ngx.req.clear_header("X-OIDC-SUB")
        ngx.req.clear_header("X-OIDC-USER")
{% if access_list.items.length > 0 %}
        -- This list also has Basic Auth users: let nginx auth_basic handle them (OR semantics).
        local auth_header = ngx.var.http_authorization
        if auth_header and auth_header:sub(1, 6) == "Basic " then
            return
        end
{% endif %}
        local oidc_providers = {
{% for provider in access_list.oidc_providers %}
            {
                redirect_path = {{ provider.redirect_path | lua_string }},
                discovery = {{ provider.discovery | lua_string }},
                token_endpoint_auth_method = "client_secret_basic",
                client_id = {{ provider.client_id | lua_string }},
                client_secret = {{ provider.client_secret | lua_string }},
                scope = {{ provider.scopes | lua_string }},
                username_claim = {{ provider.username_claim | lua_string }}
            },
{% endfor %}
        }

        local authenticated = false
        local last_err = nil
        for _, provider_opts in ipairs(oidc_providers) do
            provider_opts.redirect_uri = ngx.var.scheme .. "://" .. ngx.var.host .. provider_opts.redirect_path
            -- Tokens are verified against the provider JWKS fetched via the discovery
            -- document; lua-resty-openidc validates state/nonce automatically.
            local res, err = openidc.authenticate(provider_opts)
            if res then
                authenticated = true
                if res.id_token then
                    if res.id_token.sub and type(res.id_token.sub) == "string" then
                        ngx.req.set_header("X-OIDC-SUB", res.id_token.sub)
                    end
                    local username_value = res.id_token[provider_opts.username_claim]
                    if username_value and type(username_value) == "string" then
                        ngx.req.set_header("X-OIDC-USER", username_value)
                    end
                end
                break
            end
            last_err = err
        end

        if not authenticated then
            ngx.status = 401
            if last_err then
                ngx.log(ngx.WARN, "npm oidc authentication failed: ", last_err)
            end
            ngx.exit(ngx.HTTP_UNAUTHORIZED)
        end
    }
{% endif %}
